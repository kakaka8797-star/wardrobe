<!DOCTYPE html>
<html lang="hi">
<head>

<title>AI Wardrobe</title>
<style>
:root{--bg:#FAF8F5;--card:#FFFFFF;--ink:#25303B;--mute:#6B7580;--line:#E6E0D8;--acc:#2F6F73;--on-acc:#FFFFFF;
--acc-soft:rgba(47,111,115,.12);--danger:#B4493F;--warn:#8A6A1F;--warn-bg:rgba(200,160,40,.14);--ok-bg:rgba(47,111,115,.12);--err-bg:rgba(180,73,63,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#14181C;--card:#1E252B;--ink:#E7ECEF;--mute:#9AA6AF;--line:#2D363D;--acc:#5FB3B6;--on-acc:#0E1A1B;
--acc-soft:rgba(95,179,182,.16);--danger:#E07B6F;--warn:#E3C26A;--warn-bg:rgba(227,194,106,.14);--ok-bg:rgba(95,179,182,.14);--err-bg:rgba(224,123,111,.14)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;font-size:16px;line-height:1.4}
html{scroll-padding-bottom:100px;scroll-padding-top:70px}
body{min-height:100vh;min-height:100dvh}
body.noscroll{overflow:hidden}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.top .title{font-size:20px;font-weight:700}
.top button{background:none;border:0;font-size:22px;padding:6px 8px;color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottom a{flex:1;text-align:center;padding:8px 2px 7px;text-decoration:none;color:var(--mute);font-size:11px;font-weight:600}
.bottom a span{display:block;font-size:21px;line-height:1.2}
.bottom a.on{color:var(--acc)}
h2{font-size:19px;margin:6px 0 10px}
h3{font-size:16px;margin:14px 0 8px}
.mute{color:var(--mute)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:15px;font-weight:600;min-height:44px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.big{padding:16px 10px;font-size:16px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row>.btn{flex:1 1 0;min-width:0}
.row.two>.btn,.row.three>.btn{flex:1 1 calc(50% - 8px)}
@media (min-width:600px){.row.three>.btn{flex:1 1 0}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--mute)}
select,input[type=text],input[type=password],input[type=number],textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;
background:var(--card);color:var(--ink);font-size:16px;font-family:inherit}
input[type=range]{width:100%;accent-color:var(--acc)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.field.full{grid-column:1/-1}
@media (min-width:700px){.form{grid-template-columns:1fr 1fr 1fr}}
.selrow{display:flex;align-items:center;gap:8px}
.selrow .swatch{margin:0;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.icard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer}
.icard img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--acc-soft)}
.icard .meta{padding:8px 10px 10px}
.chip{display:inline-block;padding:1px 8px;margin:3px 4px 0 0;border-radius:999px;background:var(--acc-soft);font-size:12px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(110,110,110,.5);vertical-align:-2px;margin-right:6px}
.ititle{font-weight:700;font-size:14px;line-height:1.3}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;font-family:inherit}
.pill.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.pill small{opacity:.7;margin-left:3px}
details.more{margin:0 0 12px}
details.more summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--mute);padding:6px 0}
.note{padding:9px 11px;border-radius:10px;font-size:14px;margin:8px 0;background:var(--acc-soft)}
.note.ok{background:var(--ok-bg)}.note.err{background:var(--err-bg);color:var(--danger)}.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.mute{background:transparent;color:var(--mute);padding-left:0}
.note .chk{display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--ink)}
.banner{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:14px}
.banner a{color:var(--acc);font-weight:700}
.empty{text-align:center;padding:36px 16px;color:var(--mute)}
.empty .big{font-size:44px}
.dimg{display:block;width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--acc-soft)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;background:var(--acc-soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:700;color:var(--mute);font-size:14px;font-family:inherit}
.seg button.on{background:var(--card);color:var(--ink)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin:8px 0}
.thumbs figure{margin:0}
.thumbs img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:var(--acc-soft);display:block}
.thumbs figcaption{font-size:11px;line-height:1.2;margin-top:3px;color:var(--mute)}
.skins{display:flex;flex-wrap:wrap;gap:8px}
.skin{display:flex;align-items:center;gap:7px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px 6px 7px;font-size:14px;font-family:inherit}
.skin i{width:22px;height:22px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.skin.on{border-color:var(--acc);background:var(--acc-soft);font-weight:700}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.panel{background:var(--bg);width:100%;max-width:700px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet img.hero{display:block;width:100%;max-height:48vh;object-fit:contain;border-radius:14px;background:var(--acc-soft);margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#25303B;color:#fff;padding:10px 16px;border-radius:12px;z-index:70;
font-size:14px;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.show{opacity:1}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.reason{white-space:pre-wrap}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="title">👗 AI Wardrobe</div><button id="btnSettings" data-act="goSettings" aria-label="Settings">⚙️</button></header>
<main id="view"></main>

  <a href="#wardrobe" data-r="wardrobe"><span>🧺</span>Wardrobe</a>

<script>
(() => {
'use strict';

/* ====================================================================
   OPTIONS (dropdown lists)
==================================================================== */
const CATEGORIES = ['top', 'bottom', 'shoes', 'outerwear', 'fullbody', 'accessory'];
const CAT_LABEL = {top: '👕 Top', bottom: '👖 Bottom', shoes: '👟 Shoes', outerwear: '🧥 Outerwear', fullbody: '👗 Full outfit / Set', accessory: '⌚ Accessory'};
const SUBS = {
  top: ['t-shirt', 'polo t-shirt', 'casual shirt', 'formal shirt', 'henley', 'tank top', 'sweatshirt', 'hoodie', 'sweater', 'kurta', 'short kurta', 'crop top', 'blouse', 'tunic / kurti', 'other'],
  bottom: ['jeans', 'chinos', 'formal trousers', 'cargo pants', 'joggers', 'track pants', 'shorts', 'skirt', 'leggings', 'palazzo', 'pyjama / churidar', 'other'],
  shoes: ['sneakers', 'formal shoes', 'loafers', 'sports shoes', 'sandals', 'slippers / flip-flops', 'boots', 'heels', 'flats', 'juttis / mojaris', 'other'],
  outerwear: ['jacket', 'denim jacket', 'leather jacket', 'bomber jacket', 'blazer', 'coat', 'windcheater / raincoat', 'shrug', 'nehru jacket / waistcoat', 'other'],
  fullbody: ['saree', 'lehenga', 'salwar suit', 'kurta set', 'dress', 'jumpsuit', 'sherwani', 'other'],
  accessory: ['watch', 'belt', 'bag / backpack', 'cap / hat', 'sunglasses', 'scarf / stole', 'jewellery', 'tie', 'other']
};
const SUB_ALIASES = {shirt: 'casual shirt', tee: 't-shirt', tshirt: 't-shirt', 't shirt': 't-shirt', tshirts: 't-shirt', polo: 'polo t-shirt',
  trousers: 'formal trousers', pants: 'chinos', sneaker: 'sneakers', shoes: 'sneakers', pajama: 'pyjama / churidar', pyjama: 'pyjama / churidar'};
const FITS = {
  top: ['slim fit', 'regular fit', 'relaxed fit', 'oversized', 'boxy', 'cropped'],
  bottom: ['skinny', 'slim fit', 'straight fit', 'regular fit', 'tapered', 'relaxed', 'baggy', 'loose', 'bootcut', 'wide-leg'],
  outerwear: ['slim fit', 'regular fit', 'relaxed fit', 'oversized', 'cropped']
};
const SLEEVES = ['sleeveless', 'half sleeve', 'three-quarter sleeve', 'full sleeve'];
const NECKS = ['round neck', 'v-neck', 'polo collar', 'shirt collar', 'mandarin collar', 'hooded', 'high / turtle neck', 'henley placket', 'other'];
const LENGTHS = {
  bottom: ['full length', 'ankle length', 'three-quarter (capri)', 'knee length', 'above knee'],
  fullbody: ['mini', 'knee length', 'midi', 'maxi', 'full length']
};
const FABRICS = ['cotton', 'linen', 'denim', 'polyester', 'wool / knit', 'silk / satin', 'leather', 'fleece', 'chiffon / georgette', 'synthetic blend', 'not sure'];
const PATTERNS = ['solid', 'striped', 'checked', 'printed', 'floral', 'graphic / logo', 'colorblock', 'textured', 'embroidered'];
const STYLES = ['casual', 'smart casual', 'formal', 'party', 'sporty', 'ethnic', 'streetwear'];
const WARMTH = ['light', 'medium', 'warm'];
const APPLIES = {fit: ['top', 'bottom', 'outerwear'], sleeve: ['top', 'outerwear', 'fullbody'], neck: ['top'], length: ['bottom', 'fullbody']};
const DEP = ['fit', 'sleeve', 'neck', 'length'];
const FIELD_LABEL = {fit: 'Fit', sleeve: 'Sleeves', neck: 'Neckline / Collar', length: 'Length'};
const COLORS = {
  'white': '#FFFFFF', 'off-white': '#F4F0E6', 'cream': '#FFF3C4', 'beige': '#D8C3A5', 'sand': '#C2B280', 'khaki': '#BDB76B', 'tan': '#D2B48C',
  'light brown': '#A67B5B', 'brown': '#6B4226', 'dark brown': '#3B2314', 'maroon': '#800000', 'burgundy': '#6D1A36', 'red': '#D62828',
  'coral': '#FF6F61', 'orange': '#F28C28', 'rust': '#B7410E', 'mustard': '#E1AD01', 'yellow': '#FFE135', 'lime green': '#A4DE02',
  'light green': '#90EE90', 'mint green': '#98FF98', 'olive green': '#708238', 'dark green': '#1B5E20', 'bottle green': '#006A4E',
  'teal': '#008080', 'turquoise': '#30D5C8', 'sky blue': '#87CEEB', 'light blue': '#ADD8E6', 'blue': '#1E63D6', 'royal blue': '#2B4BCE',
  'navy blue': '#1F2A5A', 'light denim blue': '#9DB4CE', 'denim blue': '#4F6D8F', 'dark denim blue': '#2B3A55', 'lavender': '#B9A4DB',
  'purple': '#7B3FA0', 'magenta': '#C2185B', 'light pink': '#FADADD', 'pink': '#F4A6C0', 'hot pink': '#FF3E96', 'peach': '#FFCBA4',
  'light grey': '#CFCFCF', 'grey': '#8E8E8E', 'charcoal': '#36454F', 'black': '#111111', 'silver': '#C0C0C0', 'gold': '#D4AF37', 'multicolor': 'multi'
};
const COLOR_NAMES = Object.keys(COLORS);
const COLOR2 = ['none', ...COLOR_NAMES];
const EVENTS = ['Office', 'Party', 'Casual outing', 'Date', 'Wedding / Festival', 'College', 'Gym / Sports', 'Travel', 'Interview', 'Formal dinner'];
const WEATHERS = ['Hot', 'Humid', 'Pleasant', 'Cold', 'Rainy'];
const GENDERS = ['Male', 'Female', 'Other / Prefer not to say'];
const BUILDS = ['slim', 'average', 'athletic / muscular', 'broad / heavy'];
const SKIN_TONES = {'fair': '#F6D7C3', 'light': '#EBC3A3', 'wheatish': '#D9A877', 'medium (tan)': '#BE8A5A', 'brown': '#8D5A3B', 'dark': '#5A3825'};
const UNDERTONES = ['warm', 'cool', 'neutral', 'not sure'];
const FIT_PREFS = ['no preference', 'slim / fitted', 'regular', 'loose / relaxed'];
const PROFILE_DEFAULT = {name: '', gender: 'Male', height: 170, build: 'average', skin: 'wheatish', undertone: 'not sure', fit_pref: 'no preference', fav_colors: '', avoid_colors: ''};

/* ====================================================================
   SMALL HELPERS
==================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => Math.random().toString(16).slice(2, 12).padEnd(10, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const titleCase = s => String(s || '').replace(/\b\w/g, c => c.toUpperCase());
const now = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let p = Array.from({length: n + 1}, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const c = [i];
    for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    p = c;
  }
  return p[n];
}
function norm(value, options, def = null) {
  const v = String(value ?? '').trim().toLowerCase();
  if (!v) return def;
  const low = new Map(options.map(o => [String(o).toLowerCase(), o]));
  if (low.has(v)) return low.get(v);
  const keys = [...low.keys()].filter(k => k !== 'other' && k !== 'none' && (k.includes(v) || v.includes(k)));
  if (keys.length) { keys.sort((a, b) => Math.abs(a.length - v.length) - Math.abs(b.length - v.length)); return low.get(keys[0]); }
  let best = null, bs = 0;
  for (const k of low.keys()) { const s = 1 - lev(v, k) / Math.max(v.length, k.length); if (s > bs) { bs = s; best = k; } }
  return bs >= 0.6 ? low.get(best) : def;
}
function splitSub(cat, value) {
  let v = String(value ?? '').trim().toLowerCase();
  v = SUB_ALIASES[v] || v;
  if (!v) return [SUBS[cat][0], ''];
  if (SUBS[cat].includes(v)) return [v, ''];
  const m = norm(v, SUBS[cat].filter(s => s !== 'other'), null);
  if (m && v.length > 3) return [m, ''];
  return ['other', v];
}
const applies = (f, cat) => APPLIES[f].includes(cat);
function fieldOptions(f, cat) { return f === 'fit' ? FITS[cat] : f === 'sleeve' ? SLEEVES : f === 'neck' ? NECKS : LENGTHS[cat]; }
function defaultFor(f, opts) { const pref = {fit: 'regular fit', sleeve: 'half sleeve', neck: 'round neck'}[f]; return opts.includes(pref) ? pref : opts[0]; }

/* ====================================================================
   STORAGE (IndexedDB - sab kuch aapke phone mein hi)
==================================================================== */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('ai-wardrobe', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('items', {keyPath: 'id'}); d.createObjectStore('kv', {keyPath: 'k'}); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const rq = fn(t.objectStore(store));
      t.oncomplete = () => res(rq && rq.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Storage abort'));
    });
  },
  all() { return this.tx('items', 'readonly', s => s.getAll()); },
  put(it) { return this.tx('items', 'readwrite', s => s.put(it)); },
  del(id) { return this.tx('items', 'readwrite', s => s.delete(id)); },
  getKV(k, def) { return this.tx('kv', 'readonly', s => s.get(k)).then(r => (r ? r.v : def)); },
  setKV(k, v) { return this.tx('kv', 'readwrite', s => s.put({k, v})); },
  wipe() {
    return new Promise((res, rej) => {
      const t = this.db.transaction(['items', 'kv'], 'readwrite');
      t.objectStore('items').clear(); t.objectStore('kv').clear();
      t.oncomplete = () => res(); t.onerror = () => rej(t.error);
    });
  }
};

/* ====================================================================
   STATE
==================================================================== */
const S = {
  route: 'wardrobe', items: [], profile: null, pf: {...PROFILE_DEFAULT}, favs: [], hist: [],
  drafts: [], seen: new Set(), busy: false, prog: '',
  filter: {q: '', cat: 'all', colors: [], styles: []},
  sp: {event: EVENTS[0], weather: WEATHERS[0], useTemp: false, temp: 28, note: ''},
  sug: null, sugSeen: [], sugBusy: false, edit: null, seg: 'fav', installEvt: null
};
window.__S = S; // sirf testing ke liye

/* ====================================================================
   UI HELPERS
==================================================================== */
let toastTimer;
function toast(msg, ms = 2800) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function swatch(color, size) {
  const hex = COLORS[color];
  if (!hex) return `<span class="swatch" style="background:transparent;border-style:dashed${size ? `;width:${size}px;height:${size}px` : ''}"></span>`;
  const bg = hex === 'multi' ? 'linear-gradient(135deg,#e53935,#fdd835,#43a047,#1e88e5)' : hex;
  return `<span class="swatch" style="background:${bg}${size ? `;width:${size}px;height:${size}px` : ''}"></span>`;
}
function itemTitle(it) {
  let t = titleCase(`${it.color || ''} ${it.sub_category || 'item'}`.trim());
  if (it.color2 && it.color2 !== 'none') t += ' + ' + titleCase(it.color2);
  return t;
}
function itemMeta(it) {
  const chips = [CAT_LABEL[it.category] || it.category];
  for (const f of ['fit', 'sleeve', 'neck', 'length', 'pattern', 'fabric', 'style']) {
    const v = it[f]; if (v && v !== 'not sure' && v !== 'solid') chips.push(v);
  }
  if (it.warmth === 'light' || it.warmth === 'warm') chips.push(it.warmth + ' wear');
  let sw = swatch(it.color);
  if (it.color2 && it.color2 !== 'none') sw += swatch(it.color2, 10);
  const notes = it.notes ? `<div class="small mute">📝 ${esc(it.notes)}</div>` : '';
  return `<div class="ititle">${sw}${esc(itemTitle(it))}</div><div>${chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>${notes}`;
}

==================================================================== */
function loadImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Photo read nahi ho payi')); };
    im.src = u;
  });
}
async function processImage(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation: 'from-image'}); }
  catch (e) { bmp = await loadImg(file); }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
  const enc = (max, q) => {
    const s = Math.min(1, max / Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  };
  const img = enc(1024, 0.85), thumb = enc(360, 0.8);
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const x = c.getContext('2d'); x.drawImage(bmp, 0, 0, 16, 16);
  const px = x.getImageData(0, 0, 16, 16).data, g = [];
  for (let i = 0; i < px.length; i += 4) g.push(0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]);
  const avg = g.reduce((a, b) => a + b, 0) / g.length;
  const hash = g.map(v => (v > avg ? '1' : '0')).join('');
  const col = [0, 1, 2].map(k => { let t = 0; for (let i = k; i < px.length; i += 4) t += px[i]; return Math.round(t / (px.length / 4)); });
  if (bmp.close) bmp.close();
  return {img, thumb, hash, col};
}
function hamming(a, b) { let d = 0; for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) d++; return d; }
function isSame(h1, c1, h2, c2) {
  if (!h1 || !h2 || hamming(h1, h2) > 10) return false;
  if (c1 && c2 && Math.hypot(c1[0] - c2[0], c1[1] - c2[1], c1[2] - c2[2]) > 30) return false;
  return true;
}
function findDup(hash, col, items) { return items.find(it => isSame(hash, col, it.hash, it.col)) || null; }
const b64 = dataUrl => dataUrl.split(',')[1];

==================================================================== */
const API = 'https://generativelanguage.googleapis.com/v1beta';
const getKey = () => (localStorage.getItem('gw_key') || '').trim();
const getModels = () => { try { return JSON.parse(localStorage.getItem('gw_models') || 'null'); } catch (e) { return null; } };
const setModels = m => { if (m) localStorage.setItem('gw_models', JSON.stringify(m)); else localStorage.removeItem('gw_models'); };

async function fetchJSON(url, opts, timeout = 45000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), timeout);
  try {
    const r = await fetch(url, {...opts, signal: c.signal});
    const txt = await r.text();
    let data = null; try { data = JSON.parse(txt); } catch (e) { /* not json */ }
    if (!r.ok) {
      const err = new Error((data && data.error && data.error.message) || txt.slice(0, 200) || 'HTTP ' + r.status);
      err.status = r.status; err.raw = txt; throw err;
    }
    return data;
  } catch (e) {
    if (e.name === 'AbortError') { const er = new Error('timeout'); er.timeout = true; throw er; }
    throw e;
  } finally { clearTimeout(t); }
}

function friendlyError(e) {
  const msg = String(e.raw || e.message || e), low = msg.toLowerCase();
  if (low.includes('api_key_invalid') || low.includes('api key not valid') || e.status === 403) return 'API key galat hai ya kaam nahi kar rahi. Nayi key banake Settings mein daalo.';
  if (e.timeout) return 'Gemini ne 45 sec mein jawab nahi diya (time-out). Internet check karke dobara try karo.';
  if (e.status === 429 || low.includes('resource_exhausted')) return 'Gemini ki free limit khatam hai (429). Thodi der baad dobara try karo.';
  if (e.name === 'TypeError') return 'Internet ya network ki dikkat. Connection check karke dobara try karo.';
  return String(e.message || e).slice(0, 200);
}
async function listFlashModels() {
  const key = getKey();
  if (!key) throw new Error('Pehle Settings mein Gemini API key daalo.');
  try { return await listFlashModelsRaw(key); } catch (e) { throw new Error(friendlyError(e)); }
}
async function listFlashModelsRaw(key) {
  const banned = ['image', 'tts', 'live', 'audio', 'thinking', 'exp', '8b', 'native', 'robotics', 'computer', 'embedding'];
  let url = `${API}/models?pageSize=200&key=${encodeURIComponent(key)}`, all = [];
  for (let i = 0; i < 6; i++) {
    const d = await fetchJSON(url);
    all.push(...(d.models || []));
    if (!d.nextPageToken) break;
    url = `${API}/models?pageSize=200&pageToken=${encodeURIComponent(d.nextPageToken)}&key=${encodeURIComponent(key)}`;
  }
  const groups = {stable: [], preview: [], lite_stable: [], lite_preview: []}, aliases = [];
  for (const m of all) {
    const name = (m.name || '').replace('models/', ''), low = name.toLowerCase();
    if (!low.includes('flash') || banned.some(b => low.includes(b))) continue;
    const acts = m.supportedGenerationMethods || [];
    if (acts.length && !acts.includes('generateContent')) continue;
    const mt = low.match(/gemini-(\d+(?:\.\d+)?)-flash/);
    if (!mt) { aliases.push(name); continue; }
    const key2 = (low.includes('lite') ? 'lite_' : '') + (low.includes('preview') ? 'preview' : 'stable');
    groups[key2].push([parseFloat(mt[1]), name]);
  }
  let res = [];
  for (const k of ['stable', 'preview', 'lite_stable', 'lite_preview']) res.push(...groups[k].sort((a, b) => b[0] - a[0]).map(x => x[1]));
  res = res.concat(aliases);
  if (!res.length) throw new Error("Koi 'flash' model nahi mila. API key check karo.");
  return res;
}

function retryDelay(msg) {
  const low = msg.toLowerCase();
  if (low.includes('perday') || low.includes('per day')) return null;
  const m = msg.match(/retry in ([\d.]+)s/i) || msg.match(/retryDelay\W+(\d+)/);
  return m ? parseFloat(m[1]) : 8;
}

async function callGemini(parts, {json = true, temperature = 0.4} = {}) {
  const key = getKey();
  if (!key) throw new Error('Pehle Settings mein Gemini API key daalo.');
  let models = getModels();
  if (!models || !models.length) { models = await listFlashModels(); setModels(models); }
  const log = [], deadline = Date.now() + 150000;
  for (const model of models.slice(0, 6)) {
    for (let attempt = 0; attempt < 2; attempt++) {
      if (Date.now() > deadline) break;
      try {
        const body = {contents: [{role: 'user', parts}], generationConfig: {temperature}};
        if (json) body.generationConfig.responseMimeType = 'application/json';
        const d = await fetchJSON(`${API}/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,
          {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
        const cand = d && d.candidates && d.candidates[0];
        const text = cand && cand.content && cand.content.parts ? cand.content.parts.filter(p => p.text && !p.thought).map(p => p.text).join('') : '';
        if (text) {
          const order = [model, ...models.filter(m => m !== model)]; setModels(order); localStorage.setItem('gw_last_model', model);
          return text;
        }
        log.push(`${model}: khaali jawab aaya`); break;
      } catch (e) {
        const msg = String(e.raw || e.message || e), low = msg.toLowerCase();
        if (e.timeout) { log.push(`${model}: 45 sec mein jawab nahi aaya (time-out)`); break; }
        if (low.includes('api_key_invalid') || low.includes('api key not valid') || e.status === 403)
          throw new Error('API key galat hai ya kaam nahi kar rahi. Nayi key banake Settings mein daalo.');
        if (e.status === 429 || low.includes('resource_exhausted')) {
          const dl = retryDelay(msg);
          if (attempt === 0 && dl !== null && dl <= 30) { await sleep((dl + 1) * 1000); continue; }
          log.push(`${model}: limit khatam (429)`); break;
        }
        if (e.name === 'TypeError') throw new Error('Internet ya network ki dikkat. Connection check karke dobara try karo.');
        log.push(`${model}: ${String(e.message).slice(0, 140)}`); break;
      }
    }
  }
  setModels(null);
  throw new Error('Koi bhi model nahi chala:\n- ' + (log.length ? log.join('\n- ') : 'time khatam'));
}

function parseJSON(text) {
  const c = text.replace(/```json/gi, '').replace(/```/g, '').trim();
  try { return JSON.parse(c); } catch (e) { /* try slice */ }
  const a = c.indexOf('{'), z = c.lastIndexOf('}');
  if (a !== -1 && z > a) return JSON.parse(c.slice(a, z + 1));
  throw new Error('AI ka response JSON mein parse nahi ho paya.');
}
const imgPart = dataUrl => ({inline_data: {mime_type: 'image/jpeg', data: b64(dataUrl)}});

    'neck (top only)': NECKS, 'length (bottom/fullbody only)': LENGTHS, fabric: FABRICS, warmth: WARMTH, style: STYLES

  const prompt = 'You are an expert fashion cataloguer. Look at the clothing item in the photo and describe it precisely. Reply with ONLY one JSON object with the keys: category, sub_category, color, color2, pattern, fit, sleeve, neck, length, fabric, warmth, style.\n' +
    'Use ONLY values from the allowed lists below, written exactly as given. Use "" for any field that does not apply (e.g. sleeve for jeans).\n' +

    'Look carefully: t-shirt vs polo t-shirt (collar + buttons) vs casual shirt; half sleeve vs full sleeve; jeans skinny vs straight vs baggy.\n' +

  return parseJSON(await callGemini([imgPart(dataUrl), {text: prompt}]));
}

function recentWorn(days = 7) {

async function askOutfit(items, p, seen) {
  const temp = p.useTemp ? ` (about ${p.temp}°C)` : '';
  const prompt = `You are a friendly, expert Indian personal stylist.
USER PROFILE: ${profileText(S.profile)}
EVENT: ${p.event}
WEATHER: ${p.weather}${temp}
EXTRA NOTE FROM USER: ${p.note || 'none'}
WARDROBE (JSON list; use ONLY these ids): ${JSON.stringify(items.map(itemForAI))}
WORN IN LAST 7 DAYS (avoid if possible): ${JSON.stringify(recentWorn())}
ALREADY SUGGESTED COMBINATIONS (do NOT repeat these, give a clearly different outfit): ${JSON.stringify(seen)}

RULES:
1. Build one outfit: either ONE 'fullbody' item, or exactly ONE 'top' + ONE 'bottom'. Add ONE 'shoes' if any exist. Add ONE 'outerwear' only if weather/event needs it (cold, rainy, formal blazer, etc). Add up to 3 'accessory' items only if they genuinely help.
2. Weather: Hot/Humid -> light breathable fabrics (cotton, linen), light colours, half/sleeveless ok, no heavy layers. Cold -> warm fabrics + outerwear. Rainy -> avoid leather/suede/white or light long bottoms, prefer dark quick-dry items and sensible shoes.
3. Formality must match the event (formal shirt with formal trousers/shoes for office/interview; no joggers with formal shirts). Footwear must match the formality.

5. Fit and proportion: consider height and build (e.g. avoid oversized, shapeless items overwhelming a short person; balance a loose top with a slimmer bottom and vice versa). Respect the fit preference.

Reply with ONLY a JSON object:
{"fullbody_id": null, "top_id": "<id or null>", "bottom_id": "<id or null>", "shoes_id": "<id or null>", "outerwear_id": "<id or null>", "accessory_ids": [], "reason": "3-5 lines in Hinglish (Hindi+English mix) explaining why this outfit suits the event, weather, the user's skin tone, height/build, and why the colours/fits match", "tip": "one short Hinglish styling tip"}`;
  return parseJSON(await callGemini([{text: prompt}], {temperature: 0.7}));
}
function validateOutfit(r, items) {
  const by = new Map(items.map(i => [i.id, i]));
  const pick = (k, cat) => { const it = by.get(String(r[k])); return it && it.category === cat ? it : null; };
  const full = pick('fullbody_id', 'fullbody'), top = pick('top_id', 'top'), bottom = pick('bottom_id', 'bottom');
  const shoes = pick('shoes_id', 'shoes'), outer = pick('outerwear_id', 'outerwear');
  const acc = (Array.isArray(r.accessory_ids) ? r.accessory_ids : []).map(a => by.get(String(a))).filter(i => i && i.category === 'accessory').slice(0, 3);
  let main;
  if (full) main = [full]; else if (top && bottom) main = [top, bottom]; else return null;
  return [...main, ...(outer ? [outer] : []), ...(shoes ? [shoes] : []), ...acc].map(i => i.id);
}

async function addFiles(files) {
  if (!files.length) return;
  toast('Photos process ho rahi hain...');
  let added = 0;
  for (const file of files) {
    const sig = `${file.name}-${file.size}-${file.lastModified}`;
    if (S.seen.has(sig)) continue;
    S.seen.add(sig);
    try {
      const p = await processImage(file);
      let dup = '';
      const hit = findDup(p.hash, p.col, S.items);
      if (hit) dup = 'Ye photo wardrobe mein pehle se lagti hai: ' + itemTitle(hit);
      else if (S.drafts.some(d => isSame(p.hash, p.col, d.hash, d.col))) dup = 'Ye photo pehle chuni hui photo jaisi hai.';
      S.drafts.push({id: uid(), ...p, status: 'new', msg: '', dup, allowDup: false, f: blankForm()});
      added++;
    } catch (e) { toast(`'${file.name}' read nahi ho payi`); }
  }
  if (S.route === 'add') render(); else if (added) location.hash = '#add';
}
async function runAnalyze(ids) {
  if (S.busy) return toast('Ek analysis pehle se chal rahi hai.');
  if (!getKey()) { toast('Pehle Settings mein API key daalo.'); location.hash = '#settings'; return; }
  const list = ids.map(id => S.drafts.find(d => d.id === id)).filter(Boolean);
  if (!list.length) return;
  S.busy = true; refreshBar();
  document.querySelectorAll('[data-act="analyze1"]').forEach(b => b.disabled = true);
  for (let i = 0; i < list.length; i++) {
    const d = list[i];
    S.prog = `Analyze ho raha hai: ${i + 1}/${list.length} (limit se bachne ke liye thoda wait ho sakta hai)`; refreshBar();
    d.status = 'busy'; refreshDraft(d.id);
    if (i > 0) await sleep(4000);
    try { applyAI(d.f, await analyzeImage(d.img)); d.status = 'done'; d.msg = ''; }
    catch (e) { d.status = 'error'; d.msg = e.message; }
    refreshDraft(d.id);
  }
  S.busy = false; S.prog = '';
  if (S.route === 'add') render();
}
async function saveDrafts(ids) {
  let saved = 0, skipped = 0;
  for (const id of ids) {
    const d = S.drafts.find(x => x.id === id); if (!d) continue;
    if (findDup(d.hash, d.col, S.items) && !d.allowDup) { skipped++; continue; }
    const it = {...toItem(d.f), id: uid(), img: d.img, thumb: d.thumb, hash: d.hash, col: d.col, added: now().slice(0, 10)};
    try { await DB.put(it); } catch (e) { toast('Save fail (phone ki storage bhar gayi?): ' + e.message, 5000); break; }
    S.items.push(it); S.drafts = S.drafts.filter(x => x.id !== id); saved++;
  }
  if (!S.drafts.length) S.seen.clear();
  S.sug = null;
  let msg = saved ? `✅ ${saved} kapde save ho gaye!` : '';
  if (skipped) msg += ` ⚠️ ${skipped} duplicate skip hue (tick karo agar chahiye).`;
  toast(msg || 'Kuch save nahi hua.', 4000);
  render();
}

function filteredItems() {
  const F = S.filter, q = F.q.toLowerCase().trim();
  return S.items.slice().reverse().filter(it => {
    if (F.cat !== 'all' && it.category !== F.cat) return false;
    if (F.colors.length && !F.colors.includes(it.color)) return false;
    if (F.styles.length && !F.styles.includes(it.style)) return false;
    if (q) {
      const blob = ['category', 'sub_category', 'color', 'color2', 'pattern', 'fit', 'sleeve', 'neck', 'length', 'fabric', 'warmth', 'style', 'notes'].map(k => it[k] || '').join(' ').toLowerCase();
      return q.split(/\s+/).every(w => blob.includes(w));
    }
    return true;
  });
}

  rm(el) { S.drafts = S.drafts.filter(d => d.id !== el.dataset.id); if (!S.drafts.length) S.seen.clear(); render(); },
  clearDrafts() { if (S.busy) return toast('Analysis chal rahi hai, thoda ruko.'); S.drafts = []; S.seen.clear(); render(); },

  async saveEdit() {

    const upd = {...it, ...toItem(S.edit.f)};
    try { await DB.put(upd); } catch (e) { return toast('Save fail: ' + e.message, 5000); }
    Object.assign(it, upd); S.sug = null; closeSheet(); render(); toast('✅ Changes save ho gaye.');
  },

  export() {
    const data = {app: 'ai-wardrobe', version: 2, exported: now(), items: S.items, profile: S.profile, favs: S.favs, hist: S.hist};
    const blob = new Blob([JSON.stringify(data)], {type: 'application/json'}), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `wardrobe-backup-${now().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Backup file download ho rahi hai.');
  },
  async wipe() {
    if (!confirm('Saara data (kapde, outfits, profile) delete ho jayega. Pakka?')) return;
    if (!confirm('Aakhri baar puchh raha hoon: sab kuch delete karein?')) return;
    await DB.wipe(); S.items = []; S.favs = []; S.hist = []; S.profile = null; S.pf = {...PROFILE_DEFAULT}; S.sug = null; render(); toast('Sab data delete ho gaya.');
  },
  async install() { if (!S.installEvt) return; S.installEvt.prompt(); await S.installEvt.userChoice.catch(() => {}); S.installEvt = null; render(); }
};

document.addEventListener('click', e => {
  if (e.target.id === 'sheet') return closeSheet();
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) Promise.resolve().then(() => fn(el, e)).catch(err => toast('Error: ' + err.message, 5000));
});

function onField(el, live) {
  const f = getForm(el.dataset.scope); if (!f) return;
  const k = el.dataset.f; f[k] = el.value;
  if (live) return;
  if (k === 'category') fixForm(f);
  if (['category', 'sub', 'color', 'color2'].includes(k)) refreshForm(el.dataset.scope);
}
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.f) return onField(el, false);
  if (el.dataset.chk === 'allowdup') { const d = S.drafts.find(x => x.id === el.dataset.id); if (d) d.allowDup = el.checked; return; }
  if (el.dataset.sp) {
    const k = el.dataset.sp;
    S.sp[k] = el.type === 'checkbox' ? el.checked : (k === 'temp' ? +el.value : el.value);
    if (k === 'useTemp') $('#tempBox').classList.toggle('hide', !S.sp.useTemp);
    return;
  }
  if (el.dataset.pf) { S.pf[el.dataset.pf] = el.value; return; }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f && el.tagName === 'INPUT') return onField(el, true);
  if (el.dataset.sp) {
    const k = el.dataset.sp; if (el.type === 'checkbox') return;
    S.sp[k] = k === 'temp' ? +el.value : el.value;
    if (k === 'temp') { const t = $('#tempVal'); if (t) t.textContent = el.value; }
    return;
  }
  if (el.dataset.pf) {
    S.pf[el.dataset.pf] = el.value;
    if (el.dataset.pf === 'height') { const inch = Math.round((+el.value || 0) / 2.54), e2 = $('#inch'); if (e2) e2.textContent = `≈ ${Math.floor(inch / 12)} ft ${inch % 12} in`; }
    return;
  }
  if (el.id === 'q') { S.filter.q = el.value; const g = $('#grid'); if (g) g.innerHTML = gridHTML(); }
});

$('#fileGallery').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; addFiles(fs); });
$('#fileCamera').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; addFiles(fs); });
$('#fileSelfie').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  const msg = $('#selfieMsg'); if (msg) msg.innerHTML = '<span class="spin"></span>AI dekh raha hai...';
  try {
    const p = await processImage(file), r = await analyzeSkin(p.img);
    S.pf.skin = norm(r.skin_tone, Object.keys(SKIN_TONES), 'wheatish'); S.pf.undertone = norm(r.undertone, UNDERTONES, 'not sure');
    render(); const m2 = $('#selfieMsg'); if (m2) m2.textContent = `Andaza: ${S.pf.skin} skin, ${S.pf.undertone} undertone. Check karke "Profile save karo" dabao.`;
  } catch (err) { const m2 = $('#selfieMsg'); if (m2) m2.textContent = 'Detect nahi ho paya: ' + err.message; }
});
$('#fileImport').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d || !Array.isArray(d.items)) throw new Error('Ye sahi backup file nahi lagti.');
    let n = 0; const have = new Set(S.items.map(i => i.id));
    for (const it of d.items) if (it && it.id && it.img && !have.has(it.id)) { await DB.put(it); S.items.push(it); n++; }
    const mergeList = async (key, cur, inc) => { const ids = new Set(cur.map(x => x.id)); for (const x of inc || []) if (x && x.id && !ids.has(x.id)) cur.push(x); await DB.setKV(key, cur); };
    await mergeList('favs', S.favs, d.favs); await mergeList('hist', S.hist, d.hist);
    if (d.profile && confirm('Backup ki profile bhi restore karein? (maujooda profile badal jayegi)')) { S.profile = d.profile; S.pf = {...PROFILE_DEFAULT, ...d.profile}; await DB.setKV('profile', S.profile); }
    render(); toast(`♻️ Restore ho gaya. ${n} naye kapde jude.`, 4000);
  } catch (err) { toast('Restore fail: ' + err.message, 5000); }
});

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.route === 'settings') render(); });
window.addEventListener('error', e => { console.error(e.error || e.message); });
window.addEventListener('unhandledrejection', e => { console.error(e.reason); toast('Error: ' + ((e.reason && e.reason.message) || e.reason), 5000); });

/* ====================================================================
   START
==================================================================== */
(async function init() {
  try {
    await DB.open();
    S.items = await DB.all();
    S.profile = await DB.getKV('profile', null);
    S.favs = await DB.getKV('favs', []);
    S.hist = await DB.getKV('hist', []);
    if (S.profile) S.pf = {...PROFILE_DEFAULT, ...S.profile};
  } catch (e) {
    $('#view').innerHTML = `<div class="note err">Phone ki storage khul nahi paayi: ${esc(e.message)}<br>Private/Incognito mode mein na kholo.</div>`;
    return;
  }
  route();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
</body>
